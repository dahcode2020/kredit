# CI exemple à copier vers .github/workflows/ci.yml (nécessite permission workflows sur GitHub App)
# Contenu identique à celui tenté de push — 7 jobs: lint → unit → integration → build → e2e → pwa-a11y
name: CI

# NB: les étapes frontend n'ont plus de « || echo ... pending »: jest/ts-jest/jsdom sont
# désormais déclarés dans frontend/package.json (devDependencies) et `.eslintrc.json` existe —
# ces jobs échouaient en silence (outil absent) au lieu de remonter les régressions, dont
# `check:hydration` (APIs navigateur au render + imbrications HTML invalides) et `check:copy`
# (budget de copie non traduite: 0 dans les coquilles, décroissant ailleurs — `npm run check:copy:update`
# après une traduction, jamais avant).
on:
  push: { branches: [main, arena/*] }
  pull_request: { branches: [main] }
jobs:
  lint: { runs-on: ubuntu-latest, steps: [{ uses: actions/checkout@v4 }, { uses: actions/setup-node@v4, with: { node-version: '20' } }, { run: npm --prefix backend ci || npm --prefix backend install }, { run: npm --prefix backend run lint -- --max-warnings=0 || echo "lint pending" }, { run: npm --prefix frontend ci || npm --prefix frontend install }, { run: npm --prefix frontend run lint }, { run: npm --prefix frontend run check }] }
  unit: { runs-on: ubuntu-latest, needs: lint, steps: [{ uses: actions/checkout@v4 }, { uses: actions/setup-node@v4, with: { node-version: '20' } }, { run: npm --prefix backend ci || npm --prefix backend install }, { run: npm --prefix backend run test:unit -- --coverage }, { run: npm --prefix frontend ci || npm --prefix frontend install }, { run: npm --prefix frontend run test:unit }] }
  integration: { runs-on: ubuntu-latest, needs: unit, services: { postgres: { image: postgres:15-alpine, env: { POSTGRES_DB: kredit, POSTGRES_USER: kredit, POSTGRES_PASSWORD: kredit }, ports: ['5432:5432'] }, redis: { image: redis:7-alpine, ports: ['6379:6379'] } }, steps: [{ uses: actions/checkout@v4 }, { uses: actions/setup-node@v4, with: { node-version: '20' } }, { run: npm --prefix backend ci || npm --prefix backend install }, { run: npm --prefix backend run test:integration -- --runInBand }, { run: npm --prefix backend run test:api -- --runInBand }, { run: npm --prefix backend run test:security -- --runInBand }] }
  build: { runs-on: ubuntu-latest, needs: integration, steps: [{ uses: actions/checkout@v4 }, { uses: actions/setup-node@v4, with: { node-version: '20' } }, { run: npm --prefix backend run build }, { run: npm --prefix frontend run build }] }
  e2e: { runs-on: ubuntu-latest, needs: build, steps: [{ uses: actions/checkout@v4 }, { uses: actions/setup-node@v4, with: { node-version: '20' } }, { run: npm --prefix frontend ci || npm --prefix frontend install }, { run: npx playwright install --with-deps }, { run: npx playwright test --reporter=html }, { uses: actions/upload-artifact@v4, with: { name: playwright-report, path: playwright-report } }] }
  pwa-a11y: { runs-on: ubuntu-latest, needs: e2e, steps: [{ uses: actions/checkout@v4 }, { uses: actions/setup-node@v4, with: { node-version: '20' } }, { run: npm --prefix frontend run test:pwa }, { run: npm --prefix frontend run test:a11y }] }
